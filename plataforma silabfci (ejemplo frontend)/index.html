<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILAB FCI — Sistema de Inventario y Laboratorios</title>
  <link rel="icon" href="assets/logo-mark.png" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="ext-resource-dependency" content="assets/logo-mark.png" data-resource-id="logoMark" />
  <meta name="ext-resource-dependency" content="assets/logo-full.png" data-resource-id="logoFull" />
  <template id="__bundler_thumbnail" data-bg-color="#0c3b22">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0c3b22"/>
      <g transform="translate(420 250)">
        <rect x="0" y="0" width="360" height="300" rx="28" fill="none" stroke="#ffffff" stroke-width="14"/>
        <path d="M70 60 L70 240 L150 240 L150 60 Z" fill="#1c7344"/>
        <path d="M210 60 L210 240 L290 240 L290 60 Z" fill="#155c37"/>
        <path d="M120 250 Q200 130 300 90" fill="none" stroke="#7fb539" stroke-width="22" stroke-linecap="round"/>
      </g>
    </svg>
  </template>
  <style>
    /* ---------- Responsive ---------- */
    @media (max-width: 1240px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }
      .chart-row-3 { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 1024px) {
      .chart-row { grid-template-columns: 1fr !important; }
      .chart-row-3 { grid-template-columns: 1fr !important; }
      .detail-grid { grid-template-columns: 1fr !important; }
      .hdr-quick { display: none !important; }
    }
    @media (max-width: 860px) {
      .sb { position: fixed !important; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .22s !important; width: 246px !important; }
      .sb.sb-mobile-open { transform: translateX(0) !important; }
      .sb-collapse { display: none !important; }
      .hdr-menu { display: inline-flex !important; }
      .crumb-home { display: none !important; }
      .hdr-search { min-width: 0 !important; flex: 1 !important; }
      .hdr-search span:not(.kbd) { display: none; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .hdr-profile-name { display: none !important; }
      .step-label { display: none !important; }
    }
    @media (max-width: 560px) {
      .reports-grid { grid-template-columns: 1fr !important; }
      .kpi-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (plain JS) -->
  <script src="js/data.js"></script>

  <!-- Components & screens (JSX) -->
  <script type="text/babel" src="js/icons.jsx"></script>
  <script type="text/babel" src="js/charts.jsx"></script>
  <script type="text/babel" src="js/components.jsx"></script>
  <script type="text/babel" src="js/shell.jsx"></script>
  <script type="text/babel" src="js/login.jsx"></script>
  <script type="text/babel" src="js/dashboard.jsx"></script>
  <script type="text/babel" src="js/dashboard-roles.jsx"></script>
  <script type="text/babel" src="js/inventory.jsx"></script>
  <script type="text/babel" src="js/equipment-detail.jsx"></script>
  <script type="text/babel" src="js/loans.jsx"></script>
  <script type="text/babel" src="js/loan-wizard.jsx"></script>
  <script type="text/babel" src="js/operations.jsx"></script>
  <script type="text/babel" src="js/reports.jsx"></script>
  <script type="text/babel" src="js/admin.jsx"></script>
  <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
